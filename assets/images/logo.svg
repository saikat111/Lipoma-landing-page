<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Logo Icon: Medical Shield + Crescent Moon + Herbal Leaf -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#medGrad)"/>
    <!-- Crescent Moon -->
    <path d="M40 12 A 19 19 0 1 1 20 46 A 15 15 0 0 0 40 12 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Herbal Leaf -->
    <path d="M28 35 C 28 22 40 18 44 16 C 44 29 34 39 28 35 Z" fill="url(#leafGrad)"/>
    <path d="M30 33 Q 35 27 41 22" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Medical Plus Symbol -->
    <rect x="15" y="24" width="4.5" height="13" rx="1.5" fill="#ffffff"/>
    <rect x="10.7" y="28.2" width="13" height="4.5" rx="1.5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 11)">
    <!-- Primary Brand Name -->
    <text x="0" y="28" font-family="'Hind Siliguri', 'Inter', -apple-system, sans-serif" font-size="31" font-weight="900" fill="#0c4a6e" letter-spacing="-0.5">
      South<tspan fill="#0284c7">Moon</tspan>
    </text>
    
    <!-- HIGH CONTRAST 100% ORIGINAL BADGE (Crisp Latin '100%') -->
    <g transform="translate(166, 7)">
      <rect x="0" y="0" width="136" height="24" rx="12" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1.5"/>
      <text x="68" y="17" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        ★ 100% অরিজিনাল ★
      </text>
    </g>

    <!-- Clear Bengali Subtitle (Crisp Latin '100%') -->
    <text x="0" y="50" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="800" fill="#047857">
      লাইপোমা কেয়ার <tspan fill="#0284c7" font-weight="700">• 100% প্রাকৃতিক ভেষজ ফর্মুলা</tspan>
    </text>
  </g>
</svg>
